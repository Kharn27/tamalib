[platformio]
description = TamaLIB example project for the ESP32 Cheap Yellow Display (CYD)
default_envs = esp32cyd
src_dir = src
include_dir = include
lib_dir = lib
boards_dir = boards

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
upload_speed = 921600
board_build.flash_mode = qio
board_build.flash_size = 16MB
build_unflags = -std=gnu++11
build_flags = 
  -std=gnu++17
  -Wall
  -Wextra
  -Wno-unused-parameter
  -O2
  -DTAMALIB_PLATFORM="ESP32_CYD"
  -DCORE_DEBUG_LEVEL=5

test_ignore = *

[env:esp32cyd]
board = esp32-cyd
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
extra_scripts = 
  pre:scripts/copy_roms.py

targets = 
  build
  upload
  monitor
